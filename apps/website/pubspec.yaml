name: website
description: >-
  Side-by-side comparison site (mermaid.js vs the Dart port), built with Jaspr.
  The Dart renderer is embedded directly via jaspr_flutter_embed — no separate
  Flutter web build step.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  jaspr: ^0.23.1
  jaspr_flutter_embed: ^0.4.11
  # Standalone ELK layered layout — drives the /elk demo page (no mermaid).
  elk: ^0.2.1
  mermaid_core: ^0.3.2
  mermaid_flutter: ^0.3.2
  mermaid_samples: ^0.1.0
  universal_web: ^1.1.0
  jaspr_router: ^0.8.2

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  jaspr_builder: ^0.23.1
  # Renders the elk README to HTML for the /elk page (build-time only).
  markdown: ^7.3.0

jaspr:
  mode: static
  # Port for the static-build crawl server (default 8080 is often taken).
  port: 8091
