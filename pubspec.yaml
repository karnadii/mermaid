name: _mermaid_dart_workspace
publish_to: none
environment:
  sdk: ^3.13.0
workspace:
  - packages/elk
  - packages/mermaid_core
  - packages/mermaid_flutter
  - packages/mermaid_samples
  - apps/demo
  - apps/website
  - tool/bench

# Resolve the KaTeX core to our mathnote branch (karnadii/katex), not the
# pub.dev release: the app renders diagram maths through the same core it
# renders notes with, and the fork's own tests must exercise that core, or
# they measure something the app never runs. This is an override, not a
# direct dependency, on purpose — a git dependency would make
# mermaid_core/mermaid_flutter unpublishable (`dart pub publish` rejects
# git sources, and the analyzer flags `invalid_dependency`), and this fork
# still releases to pub.dev from main. The published pubspecs keep the
# hosted `katex_dart: ^0.1.0` constraint; the app pins the same branch
# through its own override, so every graph resolves to one revision.
dependency_overrides:
  katex_dart:
    git:
      url: https://github.com/karnadii/katex.git
      ref: mathnote
      path: packages/katex_dart
